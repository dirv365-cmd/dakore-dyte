window.addEventListener("load", () => {
    // 1. Detección de Android para agrandarme la polla
    if (/Android/i.test(navigator.userAgent)) {
        document.body.classList.add('is-android');
    }

    // Noche⁻¹ a⁻¹ te amooo
    function handleConnectionChange() {
        if (navigator.connection) {
            const conn = navigator.connection;
            if (conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g' || conn.effectiveType === '3g' || conn.downlink < 1.5) {
                document.body.classList.remove('crt-effect');
                console.log("Conexión inestable detectada: Filtro CRT desactivado.");
            } else {
                document.body.classList.add('crt-effect');
            }
        }
    }
    handleConnectionChange();
    if (navigator.connection) {
        navigator.connection.addEventListener('change', handleConnectionChange);
    }
});

const draggables = document.querySelectorAll('.draggable');
let activeDrag = null;
let startX, startY, initialLeft, initialTop;

function snapToGrid(value, max) {
    const gridSize = window.innerWidth < 768 ? 64 : 96;
    let snapped = Math.round(value / gridSize) * gridSize;

    return Math.max(0, Math.min(snapped, max));
}

draggables.forEach(el => {
    const dragHandle = el.querySelector('.drag-handle') || el;

    dragHandle.addEventListener('pointerdown', (e) => {
        activeDrag = el;
        
        if (window.getComputedStyle(el).transform !== 'none') {
            const rect = el.getBoundingClientRect();
            el.style.transform = 'none';
            el.style.right = 'auto';
            el.style.left = rect.left + 'px';
            el.style.top = rect.top + 'px';
        }

        startX = e.clientX;
        startY = e.clientY;
        initialLeft = el.offsetLeft;
        initialTop = el.offsetTop;
        
        el.style.zIndex = 1000;
        dragHandle.setPointerCapture(e.pointerId);
    });

    dragHandle.addEventListener('pointermove', (e) => {
        if (activeDrag !== el) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        
        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;

        const maxX = window.innerWidth - el.offsetWidth;
        const maxY = window.innerHeight - el.offsetHeight;

        newLeft = Math.max(0, Math.min(newLeft, maxX));
        newTop = Math.max(0, Math.min(newTop, maxY));

        el.style.left = `${newLeft}px`;
        el.style.top = `${newTop}px`;
    });

    dragHandle.addEventListener('pointerup', (e) => {
        if (activeDrag !== el) return;
        activeDrag = null;
        el.style.zIndex = 5; 
        dragHandle.releasePointerCapture(e.pointerId);

        const maxX = window.innerWidth - el.offsetWidth;
        const maxY = window.innerHeight - el.offsetHeight;

        el.style.left = `${snapToGrid(el.offsetLeft, maxX)}px`;
        el.style.top = `${snapToGrid(el.offsetTop, maxY)}px`;
    });
});

const baseLang = lang.slice(0, 2); 
const noticias = data[lang] || data[baseLang] || data['es'];

        noticias.forEach(noticia => {
            const article = document.createElement("article");
            article.className = "noticia-card";
            let galeriaHTML = "";
            if (noticia.imagenes && noticia.imagenes.length > 0) {
                galeriaHTML = `<div class="noticia-galeria" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
                    ${noticia.imagenes.map(img => 
                        `<img class="noticia-thumb" src="/${img}" width="120" loading="lazy">`
                    ).join("")}
                </div>`;
            }
            article.innerHTML = `
                <div class="noticia-meta">
                    <div class="noticia-icon">${noticia.icon || "📰"}</div>
                    <div class="noticia-body">
                        <h3>${noticia.titulo}</h3>
                        <p class="date">DATE: ${noticia.fecha}</p>
                        ${noticia.detalle ? `<p style="font-size:14px">${noticia.detalle}</p>` : ""}
                        ${galeriaHTML}
                    </div>
                </div>
            `;
            contenedor.appendChild(article);
        });
    })

            e.preventDefault();
            const staticOverlay = document.getElementById("tvStatic");
            staticOverlay.style.display = "block";
            
            void staticOverlay.offsetWidth; 
            staticOverlay.classList.add("show-static");

            setTimeout(() => {

            }, 600);

    });
});

document.querySelectorAll(".special-drag").forEach(el => {

    const img = el.querySelector(".swap-img");
    let imgIndex = 0;

    let moved = false;
    let startX = 0;
    let startY = 0;

    el.addEventListener("pointerdown", (e) => {
        startX = e.clientX;
        startY = e.clientY;
        moved = false;
    });

    el.addEventListener("pointermove", (e) => {
        if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) {
            moved = true;
        }
    });

    el.addEventListener("click", (e) => {

        if (moved) return;

        const rect = el.getBoundingClientRect();
        const edge = 20;

        const isEdge =
            e.clientX < rect.left + edge ||
            e.clientX > rect.right - edge ||
            e.clientY < rect.top + edge ||
            e.clientY > rect.bottom - edge;

if (!isEdge) {

    reproducirSonidoRandom();

    img.classList.remove("squash");
    void img.offsetWidth;
    img.classList.add("squash");

    imgIndex = (imgIndex + 1) % imagenesSwap.length;
    img.src = imagenesSwap[imgIndex];

}

    });
