<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFE WEB</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Pantalla de inicio con el botón gigante */
    #startScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        transition: opacity 1.5s ease-out, visibility 1.5s;
    }

    #warningButton {
        padding: 30px 60px;
        font-size: 2.5rem;
        font-weight: bold;
        color: #ff3333;
        background: none;
        border: 4px solid #ff3333;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(255, 51, 51, 0.2);
    }

    #warningButton:hover {
        background-color: #ff3333;
        color: black;
        box-shadow: 0 0 40px rgba(255, 51, 51, 0.6);
        transform: scale(1.05);
    }

    #chaosCanvas {
        display: block;
        opacity: 0; 
        transition: opacity 3s ease-in;
    }
</style>
</head>

<body>

    <div id="startScreen">
        <button id="warningButton">No apto para epilépticos</button>
    </div>

    <canvas id="chaosCanvas"></canvas>
    
    <script>
    const canvas = document.getElementById('chaosCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const warningButton = document.getElementById('warningButton');
    const sonido = new Audio('https://res.cloudinary.com/dmvbp6oq2/video/upload/v1772765205/re_larga_n85yto.mp3');

    let width, height;
    let particles = [];
    let insanityLevel = 0; 
    let frameCount = 0;
    let isRunning = false;

    let phase = 'escalating';
    let fadeAlpha = 0;
    let peakTimer = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        if (isRunning) initParticles();
    }
    window.addEventListener('resize', resize);

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.5; 
            this.vy = (Math.random() - 0.5) * 0.5;
            this.radius = Math.random() * 2 + 1;
            this.hue = 0; 
            this.saturation = 0;
            this.lightness = 10; 
        }

        update() {
            this.vx += (Math.random() - 0.5) * (insanityLevel * 0.05);
            this.vy += (Math.random() - 0.5) * (insanityLevel * 0.05);

            const maxSpeed = 2 + (insanityLevel * 0.2);
            this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));
            this.vy = Math.max(-maxSpeed, Math.min(maxSpeed, this.vy));

            this.x += this.vx;
            this.y += this.vy;

            this.saturation = Math.min(100, insanityLevel * 2);
            if (insanityLevel > 10) {
                this.lightness = Math.min(50 + (Math.random() * 10), 100);
                this.hue = (this.hue + 1 + (insanityLevel * 0.1)) % 360;
            } else {
                this.lightness = 10;
            }

            if (insanityLevel > 80) {
                this.radius = Math.random() * (insanityLevel * 0.1) + 1;
            } else if (insanityLevel === 0) {
                this.radius = Math.random() * 2 + 1; 
            }

            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            if (insanityLevel < 60) {
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            } else {
                let glitchSize = this.radius * (1 + Math.random() * insanityLevel * 0.05);
                ctx.rect(this.x, this.y, glitchSize, glitchSize);
            }
            ctx.fillStyle = `hsl(${this.hue}, ${this.saturation}%, ${this.lightness}%)`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < 200; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        if (!isRunning) return;
        requestAnimationFrame(animate);
        frameCount++;

        if (phase === 'escalating') {
            if (insanityLevel < 250) {
                insanityLevel += 0.008675; 
            } else {
                peakTimer++;
                if (peakTimer > 150) {
                    phase = 'fading';
                    peakTimer = 0;
                }
            }
        } else if (phase === 'fading') {
            fadeAlpha += 0.005; 
            if (fadeAlpha >= 1) {
                sonido.pause();
                sonido.currentTime = 0; 
                sonido.play().catch(e => console.log("Re-reproducción bloqueada"));
                insanityLevel = 0;
                initParticles(); 
                phase = 'recovering';
            }
        } else if (phase === 'recovering') {
            fadeAlpha -= 0.005;
            if (fadeAlpha <= 0) {
                fadeAlpha = 0;
                phase = 'escalating';
            }
        }

        let alphaTrail = Math.max(0.01, 0.2 - (insanityLevel * 0.002));
        ctx.fillStyle = `rgba(0, 0, 0, ${alphaTrail})`;
        ctx.fillRect(0, 0, width, height);

        let isTranslated = false;
        if (insanityLevel > 70 && Math.random() > 0.98) {
            ctx.fillStyle = `hsla(${Math.random()*360}, 100%, 50%, 0.1)`;
            ctx.fillRect(0, 0, width, height);
            ctx.save();
            ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
            isTranslated = true;
        }

        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                let connectionLimit = 100 + (insanityLevel * 0.5);
                
                if (distance < connectionLimit) {
                    ctx.beginPath();
                    let lineAlpha = (1 - distance / connectionLimit) * (insanityLevel * 0.01);
                    ctx.strokeStyle = `hsla(${particles[i].hue}, ${particles[i].saturation}%, ${particles[i].lightness}%, ${lineAlpha})`;
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }

        particles.forEach(particle => {
            particle.update();
            particle.draw();
        });

        if (isTranslated) ctx.restore();

        if (insanityLevel > 90 && Math.random() > 0.9) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.2})`;
            for(let i=0; i<10; i++) {
                ctx.fillRect(0, Math.random()*height, width, Math.random()*20);
            }
        }

        if (fadeAlpha > 0) {
            ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
            ctx.fillRect(0, 0, width, height);
        }
    }

    warningButton.addEventListener('click', () => {

        startScreen.style.opacity = '0';
        setTimeout(() => {
            startScreen.style.visibility = 'hidden';
        }, 1500);


        canvas.style.opacity = '1';
        sonido.play().then(() => {
            console.log("Audio iniciado");
        }).catch(error => {
            console.error("Error al reproducir audio:", error);
        });

        isRunning = true;
        resize();
        animate();
    }, { once: true });

    sonido.load();
    </script>
</body>
</html>
