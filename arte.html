function getSystemLanguage() {
    const rawLang = navigator.language.toLowerCase();
    if (rawLang.includes('es-mx') || rawLang.includes('es-419') || rawLang.includes('-mx')) {
        return "mx";
    } else if (rawLang.startsWith('es')) {
        return "es";
    } else if (rawLang.startsWith('pt')) {
        return "pt";
    }
    return "en";
}

function translatePage() {

        if (i18n[lang] && i18n[lang][key]) {

    });

<script>
document.addEventListener("DOMContentLoaded", () => {
    const galeria = document.getElementById("galeria");
    const visor = document.getElementById("visorDibujo");
    const visorImg = document.getElementById("visorImg");
    const visorNombre = document.getElementById("visorNombre");
    const visorDescripcion = document.getElementById("visorDescripcion");
    const cerrarVisorBtn = document.getElementById("cerrarVisor");
    const lupa = document.getElementById("lupa");

    let rotacion = 0;
    let lupaRadio = 75; 
    let lupaZoom = 2.5;
    const intervals = {};

    function startInterval(name, fn, ms = 16){
        if(intervals[name]) clearInterval(intervals[name]);
        intervals[name] = setInterval(fn, ms);
    }

    async function cargarGaleria(){
        try {
            const lang = getSystemLanguage();
            const res = await fetch(`..arte.json?v=` + Date.now());
            if (!res.ok) throw new Error(`No se encontró el archivo manifest.json`);
            
            const manifestData = await res.json();
            galeria.innerHTML = "";

            const manifestList = manifestData[lang] || manifestData["en"] || [];

            manifestList.forEach(item => {
                const card = document.createElement("div");
                card.className = "dibujo-card";
                
                card.innerHTML = `<img src="${item.ruta}" class="dibujo-thumb" draggable="false">`;
                card.addEventListener("click", () => abrirVisor(item));
                galeria.appendChild(card);
            });
        } catch(e) { 
            console.error("Error:", e);
            alert("Error de ruta: " + e.message);
        }
    }

    function abrirVisor(item){
        visorImg.src = item.ruta;
        rotacion = 0;
        visorImg.style.transform = `rotateY(0deg) scale(1)`;
        
        visorNombre.textContent = item.titulo || "Untitled_Artwork.png";
        visorDescripcion.textContent = item.descripcion || "No description found... x_x";
        
        visor.classList.remove("oculto");
    }

    cerrarVisorBtn.addEventListener("click", () => {
        visor.classList.add("oculto");
        lupa.style.display = "none";
    });

    // --- Lógica de Rotación ---
    document.getElementById("rotarIzq").addEventListener("pointerdown", () => {
        startInterval("rotar", () => {
            rotacion -= 3;
            visorImg.style.transform = `rotateY(${rotacion}deg)`;
        });
    });
    document.getElementById("rotarDer").addEventListener("pointerdown", () => {
        startInterval("rotar", () => {
            rotacion += 3;
            visorImg.style.transform = `rotateY(${rotacion}deg)`;
        });
    });
    document.addEventListener("pointerup", () => clearInterval(intervals["rotar"]));

    document.getElementById("zoomIn").addEventListener("click", () => {
        if (lupaRadio < 200) {
            lupaRadio += 15;
            lupaZoom += 0.2;
            actualizarEstiloLupa();
        }
    });

    document.getElementById("zoomOut").addEventListener("click", () => {
        if (lupaRadio > 30) { 
            lupaRadio -= 15;
            lupaZoom -= 0.2;
            actualizarEstiloLupa();
        }
    });

    function actualizarEstiloLupa() {
        lupa.style.width = (lupaRadio * 2) + "px";
        lupa.style.height = (lupaRadio * 2) + "px";
    }

    visorImg.addEventListener("pointermove", (e) => {
        const rect = visorImg.getBoundingClientRect();
        if(e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
            lupa.style.display = "none"; return;
        }
        lupa.style.display = "block";

        lupa.style.left = (e.clientX - lupaRadio) + "px";
        lupa.style.top = (e.clientY - lupaRadio) + "px";
        
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const z = lupaZoom;

        lupa.style.backgroundImage = `url('${visorImg.src}')`;
        lupa.style.backgroundSize = `${rect.width * z}px ${rect.height * z}px`;
        lupa.style.backgroundPosition = `${-(x * z - lupaRadio)}px ${-(y * z - lupaRadio)}px`;
    });

    visorImg.addEventListener("pointerleave", () => {
        lupa.style.display = "none";
    });

    cargarGaleria();
});

const transition = document.getElementById("pinkTransition");
const tvStatic = document.getElementById("tvStatic");

function createPaintDrops() {
    transition.innerHTML = "";
    for (let i = 0; i < 6; i++) {
        const drop = document.createElement("div");
        drop.className = "paint-drop";
        drop.style.animationDelay = `${i * 0.1}s`;
        transition.appendChild(drop);
    }
}

document.querySelectorAll("a[href]").forEach(link => {
    link.addEventListener("click", function(e) {
        const href = this.getAttribute("href");
        const target = this.getAttribute("target");

        if (!href || href.startsWith("#") || href.startsWith("javascript:") || 
            target === "_blank" || e.ctrlKey || e.metaKey || e.shiftKey) return;

        e.preventDefault();
        createPaintDrops();
        setTimeout(() => { tvStatic.classList.add("show-static"); }, 800);
        setTimeout(() => { window.location.href = href; }, 1300); 
    });
});

window.addEventListener("pageshow", () => {
    transition.innerHTML = "";
    tvStatic.classList.remove("show-static");
});

const playlist = [
    "Bring Me The Horizon - Chelsea Smile", "Asking Alexandria - Final Episode",
    "Avril Lavigne - Sk8er Boi", "My Chemical Romance - Helena",
    "Paramore - Misery Business", "Escape The Fate - Situations",
    "Bullet For My Valentine - Tears Don't Fall", "Attack Attack! - Stick Stickly", 
    "Kids - MGMT", "Time to pretend - MGMT", "Juguete - Enjambre", 
    "Parade - Susumu Hirasawa", "Heist - Ben folds", 
    "El putón del barrio - Cuarteto de mierda", "Young Folks - Peter Bjorn and John"
];

function updateMusic() {
    const songSpan = document.getElementById("current-song");
    if (songSpan) {
        const randomSong = playlist[Math.floor(Math.random() * playlist.length)];
        songSpan.textContent = randomSong;
    }
}
updateMusic();
setInterval(updateMusic, 30000);
</script>
